[package]
name = "cuobject"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Safe Rust bindings to NVIDIA's cuObject server and client libraries for S3-over-RDMA (GPUDirect object loading)"
readme = "README.md"
keywords = ["cuobject", "rdma", "gpudirect", "s3"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["server"]
# The server side: registered staging memory, channels and RDMA transfers.
server = ["cuobject-sys/server"]
# The client side: registered client memory and the tokens a server moves
# bytes against.
client = ["cuobject-sys/client"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["server", "client"]

[dependencies]
# Publish cuobject-sys first; `cargo publish` drops the path.
cuobject-sys = { version = "0.1.0", path = "../cuobject-sys", default-features = false }
memmap2 = "0.9.12"
thiserror = "2"

[[example]]
name = "server"
required-features = ["server"]

[[example]]
name = "client"
required-features = ["client"]
